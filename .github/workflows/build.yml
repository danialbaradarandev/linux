# .github/workflows/buildroot.yml
#
# ساخت یک توزیع کامل لینوکس با Buildroot روی GitHub Actions.
# این فایل رو داخل ریپوی خودت در مسیر .github/workflows/buildroot.yml قرار بده.

name: Build Buildroot Distro

on:
  push:
    branches: [ main ]
    paths:
      - 'configs/**'
      - '.github/workflows/buildroot.yml'
  workflow_dispatch:
    inputs:
      br_version:
        description: 'نسخه Buildroot (تگ گیت)'
        required: false
        default: '2024.11.x'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340   # کمی زیر سقف ۶ ساعته گیت‌هاب

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ران‌رهای گیت‌هاب پر از ابزارهای پیش‌نصب‌شده‌ان (اندروید، داکر، دات‌نت و ...)
      # که فضای زیادی اشغال می‌کنن؛ اول پاکشون می‌کنیم.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /opt/az
          sudo docker image prune -a -f || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git libncurses-dev unzip bc rsync cpio \
            file wget cmake python3 python3-pip libssl-dev bison flex \
            ccache

      - name: Clone Buildroot
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.br_version || '2024.11.x' }}" \
            https://github.com/buildroot/buildroot.git

      # کش کردن سورس دانلودشده پکیج‌ها (dl/) -- سنگین‌ترین بخش از نظر زمان دانلود
      - name: Cache Buildroot dl/
        uses: actions/cache@v4
        with:
          path: buildroot/dl
          key: br-dl-${{ hashFiles('configs/**') }}
          restore-keys: |
            br-dl-

      # کش کردن ccache -- کامپایل مجدد پکیج‌های تغییرنکرده رو خیلی سریع می‌کنه
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: br-ccache-${{ runner.os }}-${{ hashFiles('configs/**') }}-${{ github.sha }}
          restore-keys: |
            br-ccache-${{ runner.os }}-${{ hashFiles('configs/**') }}-
            br-ccache-${{ runner.os }}-

      - name: Apply custom defconfig
        run: |
          cp configs/myboard_defconfig buildroot/configs/
          cd buildroot
          make myboard_defconfig

      - name: Enable ccache in Buildroot config
        run: |
          cd buildroot
          echo 'BR2_CCACHE=y' >> .config
          echo "BR2_CCACHE_DIR=\"$HOME/.buildroot-ccache\"" >> .config
          make olddefconfig

      - name: Build
        run: |
          cd buildroot
          make -j"$(nproc)"

      - name: Show output size
        run: du -sh buildroot/output/images/* || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-images
          path: buildroot/output/images/*
          retention-days: 14

      # اختیاری: در صورت شکست build، لاگ‌های کامل رو آپلود کن تا دیباگ راحت‌تر بشه
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-logs
          path: buildroot/output/build/build-time.log
