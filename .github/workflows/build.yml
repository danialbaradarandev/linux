name: Build Sony Xperia Z2 Kernel (Downstream)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip python3 python2 bc bison flex libssl-dev make gcc g++

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3

      - name: Clone kernel source
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_sony_msm8974.git -b lineage-18.1 kernel

      - name: Clone toolchain (proton-clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git -b master proton-clang

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-xperia-z2

      - name: Build kernel
        run: |
          cd kernel
          export PATH=$(pwd)/../proton-clang/bin:$PATH
          export ARCH=arm
          export CC=clang
          export CROSS_COMPILE=arm-linux-gnueabi-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out shinano_sirius_defconfig
          make O=out -j$(nproc --all) \
            CC=clang \
            CLANG_TRIPLE=arm-linux-gnueabi- \
            CROSS_COMPILE=arm-linux-gnueabi- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            OBJSIZE=llvm-size \
            STRIP=llvm-strip \
            LDGOLD=aarch64-linux-gnu-ld.gold \
            LLVM_AR=llvm-ar \
            LLVM_DIS=llvm-dis

      - name: Package with AnyKernel3
        run: |
          cp kernel/out/arch/arm/boot/zImage AnyKernel3/zImage
          cd AnyKernel3
          zip -r9 ../Xperia-Z2-Kernel-${{ github.run_number }}.zip *

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xperia-Z2-Kernel-${{ github.run_number }}
          path: |
            Xperia-Z2-Kernel-*.zip
            kernel/out/arch/arm/boot/zImage
          if-no-files-found: warn