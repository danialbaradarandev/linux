name: Build Yocto Distro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils iputils-ping python3-git python3-jinja2 python3-subunit zstd liblz4-tool file locales libacl1

      - name: Clone Poky (Yocto reference)
        run: |
          git clone -b scarthgap git://git.yoctoproject.org/poky
          cd poky

      - name: Configure and Build
        run: |
          cd poky
          source oe-init-build-env
          # تنظیم ماشین هدف (x86_64 برای QEMU)
          echo 'MACHINE = "qemux86-64"' >> conf/local.conf
          # استفاده از کش سرور Yocto برای سرعت بیشتر
          echo 'BB_HASHSERVE = "auto"' >> conf/local.conf
          echo 'BB_HASHSERVE_UPSTREAM = "wss://hashserv.yoctoproject.org/ws"' >> conf/local.conf
          echo 'SSTATE_MIRRORS ?= "file://.* http://sstate.yoctoproject.org/all/PATH;downloadfilename=PATH"' >> conf/local.conf
          # شروع بیلد
          bitbake core-image-minimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-image
          path: poky/build/tmp/deploy/images/qemux86-64/